<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alphacoders Instant Download</title>
    <style>
      :root {
        --bg: #08111f;
        --panel: #0f2034;
        --line: #263b5c;
        --text: #e7ecf5;
        --muted: #9eb0d0;
        --ok: #24c08b;
        --ok-2: #1aa06f;
        --off: #ef4444;
        --coffee: #ffdd00;
        --coffee-ink: #0d0c22;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 320px;
        min-height: 236px;
        background:
          radial-gradient(420px 170px at 88% -35%, rgba(36, 192, 139, 0.16), transparent 58%),
          radial-gradient(360px 180px at -20% 0%, rgba(80, 143, 255, 0.11), transparent 56%),
          linear-gradient(180deg, #0b1527 0%, var(--bg) 62%, #050b14 100%);
        color: var(--text);
        font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
        padding: 14px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        margin-bottom: 12px;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 11px;
        border: 1px solid rgba(126, 173, 255, 0.22);
        padding: 2px;
        object-fit: contain;
        background: rgba(255, 255, 255, 0.07);
        box-shadow: 0 9px 22px rgba(0, 0, 0, 0.24);
        flex-shrink: 0;
      }

      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 750;
        letter-spacing: 0.2px;
        line-height: 1.2;
      }

      .subtitle {
        margin: 2px 0 0;
        font-size: 11px;
        color: var(--muted);
        line-height: 1.5;
      }

      button {
        width: 100%;
        height: 42px;
        border: 0;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.2px;
        color: #f6faff;
        cursor: pointer;
        transition: transform 0.12s ease, filter 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      }

      #toggleBtn:not(.off) {
        background: linear-gradient(135deg, var(--ok), var(--ok-2));
        box-shadow: 0 10px 24px rgba(36, 192, 139, 0.24);
      }

      #toggleBtn.off {
        background: linear-gradient(135deg, var(--off), #9f2f2f);
        box-shadow: 0 9px 24px rgba(239, 68, 68, 0.2);
      }

      button:hover {
        transform: translateY(-1px);
        filter: saturate(1.04);
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 10px 0 9px;
        padding: 10px 11px;
        border-radius: 11px;
        border: 1px solid;
        font-size: 12px;
        line-height: 1.4;
        color: #d7e2fa;
        background: rgba(19, 30, 54, 0.75);
      }

      .status.on {
        border-color: rgba(36, 192, 139, 0.45);
        background: rgba(36, 192, 139, 0.1);
        color: #b6f3d5;
      }

      .status.off {
        border-color: rgba(239, 68, 68, 0.38);
        background: rgba(239, 68, 68, 0.1);
        color: #fecaca;
      }

      .status .state {
        font-weight: 700;
      }

      .meta {
        color: #9fadd1;
        font-size: 11px;
        line-height: 1.45;
      }

      .meta b {
        color: var(--text);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: block;
        flex-shrink: 0;
        background: #f87171;
        box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.12);
      }

      .status.on .dot {
        background: var(--ok);
        box-shadow: 0 0 0 4px rgba(36, 192, 139, 0.14);
      }

      .support-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
        height: 39px;
        border: 1px solid rgba(255, 221, 0, 0.34);
        background: rgba(255, 221, 0, 0.08);
        color: #ffe66b;
        box-shadow: none;
        font-size: 12.5px;
      }

      .support-btn:hover {
        border-color: rgba(255, 221, 0, 0.55);
        background: rgba(255, 221, 0, 0.13);
        box-shadow: 0 8px 20px rgba(255, 221, 0, 0.1);
      }

      .support-btn svg {
        width: 17px;
        height: 17px;
        flex-shrink: 0;
      }

      .support-btn path {
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="icon-128.png" class="brand-mark" alt="Alphacoders logo" />
      <div>
        <h1>Alphacoders Instant Download</h1>
        <div class="subtitle">Skip Alphacoders download waits.</div>
      </div>
    </div>

    <button id="toggleBtn" class="off">Enable Instant Download</button>

    <div class="status off" id="statusText"><span class="dot"></span><span class="state">Instant Download is inactive</span></div>
    <div class="meta" id="helpText">Works on wall, avatars, mobile, gifs, and supported Alphacoders pages.</div>

    <button id="supportBtn" class="support-btn" type="button" title="Support on Buy Me A Coffee">

      </svg>
      Buy me a coffee
    </button>

    <script src="popup.js"></script>
  </body>
</html>
